# 开发环境 —— 跑在你自己机器上，连本地 docker compose 起的 MySQL/Redis。
# 这里可以放明文密码，因为连的是本地容器，数据随时可丢。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flowmart_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: flowmart
    password: flowmart123
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  flyway:
    clean-disabled: false      # 开发环境允许 flyway clean 重建库，方便反复试错

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发时打印完整 SQL

logging:
  level:
    root: INFO
    com.flowmart: DEBUG
    org.springframework.jdbc: DEBUG

springdoc:
  api-docs:
    enabled: true
