# 生产环境 —— 所有敏感配置必须来自环境变量/配置中心，配置文件里不允许出现任何明文密码。
# 注意这里所有变量都没有默认值：缺一个就启动失败。这是刻意的 —— 宁可起不来，
# 也不能因为漏配了某个变量而悄悄连到错误的库上。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
  flyway:
    clean-disabled: true
    out-of-order: false        # 生产环境严格按版本号顺序执行，不允许补插旧版本脚本

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: WARN
    com.flowmart: INFO
  file:
    name: ${LOG_PATH:/var/log/flowmart}/flowmart.log

# 生产环境关闭接口文档：暴露出去等于把内部 API 结构直接送给攻击者
springdoc:
  api-docs:
    enabled: false
knife4j:
  enable: false
  production: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus     # 生产只暴露健康检查和指标，metrics/env 等一律关闭
  endpoint:
    health:
      show-details: never
