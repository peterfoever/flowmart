# flowmart 主配置
# 环境差异一律放到 application-{profile}.yml，这里只放三套环境共用的部分。
# 启动时用 --spring.profiles.active=dev|test|prod 指定，默认 dev。
spring:
  application:
    name: flowmart
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false      # 关掉静态资源映射，否则 404 不会走到 NoHandlerFoundException
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1740000    # 必须小于 MySQL wait_timeout，否则会拿到已被服务端关闭的连接
      pool-name: FlowmartHikariCP
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    table: flyway_schema_history

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful           # 优雅停机：发布时先摘流量再等在途请求处理完
  tomcat:
    threads:
      max: 200
    max-connections: 8192
    accept-count: 100

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.flowmart.**.entity
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id       # 雪花 ID，避免自增 ID 暴露业务量、也方便未来分库分表
      logic-delete-field: deleted
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn
