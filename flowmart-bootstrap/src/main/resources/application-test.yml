# 测试环境 —— 模拟公司的 test/staging。数据接近真实，多人共用，不能随便清库。
# 配置项开始走环境变量：这是你在真实工作中提测时会遇到的形态。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:flowmart_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:flowmart}
    password: ${DB_PASSWORD:flowmart123}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
  flyway:
    clean-disabled: true       # 测试环境禁止 clean，误操作会清掉测试同学的数据

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: INFO
    com.flowmart: DEBUG
  file:
    name: ${LOG_PATH:/var/log/flowmart}/flowmart.log

springdoc:
  api-docs:
    enabled: true              # 测试环境保留接口文档，测试同学要用
