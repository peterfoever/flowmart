name: CI

# CI 是你的第一道质量卡口。在真实团队里，CI 挂了 = 你的 PR 不能合。
# 不要养成「本地能跑就行」的习惯 —— 那句话是事故报告里的高频台词。
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 编译
        run: mvn -B clean compile

      - name: 运行测试
        run: mvn -B test

      - name: 打包
        run: mvn -B package -DskipTests

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: flowmart-jar
          path: flowmart-bootstrap/target/flowmart.jar
          retention-days: 7

  docker:
    name: 镜像构建验证
    runs-on: ubuntu-latest
    needs: build
    # 只在合入 develop/main 后验证镜像能不能建出来，PR 阶段跳过以节省时间
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t flowmart:${{ github.sha }} .

      - name: 检查镜像大小
        run: docker images flowmart:${{ github.sha }}
